<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Settings</title>
    <link rel="stylesheet" href="customize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <main class="shell">
        <section class="panel">
            <header class="panel-header">
                <div>
                    <h1>Overlay</h1>
                </div>
                <a href="/" target="_blank">Open</a>
            </header>

            <form id="config-form">

                <div class="section">
                    <h2>Position</h2>
                    <div class="position-grid" id="position-grid">
                        <button type="button" data-align="top-left">Top left</button>
                        <button type="button" data-align="top-right">Top right</button>
                        <button type="button" data-align="bottom-left">Bottom left</button>
                        <button type="button" data-align="bottom-right">Bottom right</button>
                    </div>
                </div>

                <div class="section split">
                    <label>
                        <span>Font size</span>
                        <input type="number" id="font-size" min="10" max="24" step="1">
                    </label>
                    <label>
                        <span>Transition delay (s)</span>
                        <input type="number" id="collapse-delay" min="1" max="30" step="0.5">
                    </label>
                </div>

                <div class="section">
                    <h2>Colors</h2>
                    <div class="segmented two-up" id="color-mode-grid">
                        <button type="button" data-mode="auto">Color Thief</button>
                        <button type="button" data-mode="manual">Manual</button>
                    </div>
                    <div class="color-row">
                    <label>
                        <span>Background</span>
                        <input type="color" id="background-color">
                    </label>
                    <label>
                        <span>Text</span>
                        <input type="color" id="text-color">
                    </label>
                    <label id="accent-field">
                        <span>Accent</span>
                        <input type="color" id="accent-color">
                    </label>
                    </div>
                </div>

                <div class="section split">
                    <label>
                        <span>Radius</span>
                        <input type="number" id="border-radius" min="0" max="24" step="1">
                    </label>
                    <label class="checkbox-label">
                        <span>Art</span>
                        <input type="checkbox" id="show-thumbnail">
                    </label>
                    <label class="checkbox-label">
                        <span>Artist</span>
                        <input type="checkbox" id="show-artist">
                    </label>
                    <label class="checkbox-label">
                        <span>Progress</span>
                        <input type="checkbox" id="show-progress">
                    </label>
                    <label class="checkbox-label">
                        <span>Time</span>
                        <input type="checkbox" id="show-time">
                    </label>
                </div>
                    <h2>Text Animation</h2>
                    <label>
                        <span>Style</span>
                        <select id="text-transition" style="width: 100%; padding: 4px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px;">
                            <!-- new animation options here -->
                            <option value="none">None</option>
                            <option value="rotating">Rotating</option>
                            <option value="fade">Fade</option>
                        </select>
                    </label>
                    
                    <!-- animation configs -->
                    <div id="text-transition-configs" style="margin-top: 8px;"></div>
                </div>

                <footer class="actions">
                    <button type="submit">Save</button>
                    <button type="button" id="reset-defaults">Reset</button>
                    <button type="button" id="clear-reload">Reload</button>
                    <span id="status" aria-live="polite"></span>
                </footer>
            </form>
        </section>

        <section class="preview">
            <iframe id="preview-frame" src="/overlay.html"></iframe>
        </section>
    </main>

    <script src="customize.js"></script>
</body>

</html>
