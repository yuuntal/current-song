[package]
name = "currentsong"
version = "0.1.17"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"
image = "0.25"
lazy_static = "1.4"
tray-icon = "0.19"
open = "5"
rust-embed = "8.11.0"
mime_guess = "2.0.5"

mpris = "2"
gtk = "0.18"
